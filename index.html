<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A little birthday story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loader"><div class="loader-fox">🦊</div><p>Warming things up…</p></div>

<main id="stage" data-scene="intro">
  <div id="sparkles" aria-hidden="true"></div>

  <!-- ===== THE FOX (edit colours in style.css :root) ===== -->
  <div id="fox-wrap">
    <div id="bubble" role="status" aria-live="polite"><span id="bubble-text"></span></div>
    <button id="fox-btn" aria-label="Click the fox">
      <svg id="fox" data-state="idle" viewBox="0 0 300 340" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="fur" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#ffab5e"/><stop offset="1" stop-color="#f07f2c"/></radialGradient>
        </defs>
        <ellipse cx="150" cy="330" rx="85" ry="9" fill="rgba(60,20,40,.22)"/>
        <g class="tail"><path d="M200 290 C265 295 285 235 262 190 C250 215 232 232 205 238Z" fill="url(#fur)"/><path d="M262 190 C250 215 240 224 228 230 C238 245 262 228 262 190Z" fill="#fff3e4"/></g>
        <ellipse cx="150" cy="258" rx="62" ry="70" fill="url(#fur)"/>
        <ellipse cx="150" cy="272" rx="38" ry="52" fill="#fff3e4"/>
        <ellipse cx="118" cy="320" rx="22" ry="11" fill="#4a2a1e"/><ellipse cx="182" cy="320" rx="22" ry="11" fill="#4a2a1e"/>
        <g class="arm armL"><ellipse cx="92" cy="262" rx="15" ry="38" fill="url(#fur)"/><circle cx="92" cy="298" r="13" fill="#4a2a1e"/></g>
        <g class="arm armR"><ellipse cx="208" cy="262" rx="15" ry="38" fill="url(#fur)"/><circle cx="208" cy="298" r="13" fill="#4a2a1e"/></g>
        <g class="head">
          <path d="M90 104 L84 34 Q112 46 134 84Z" fill="url(#fur)"/><path d="M210 104 L216 34 Q188 46 166 84Z" fill="url(#fur)"/>
          <path d="M96 92 L94 54 Q110 62 124 84Z" fill="#7a3b2a"/><path d="M204 92 L206 54 Q190 62 176 84Z" fill="#7a3b2a"/>
          <path d="M84 34 Q96 38 106 46 L90 56Z" fill="#4a2a1e"/><path d="M216 34 Q204 38 194 46 L210 56Z" fill="#4a2a1e"/>
          <ellipse cx="150" cy="140" rx="78" ry="62" fill="url(#fur)"/>
          <path d="M74 134 L48 162 L92 168Z" fill="url(#fur)"/><path d="M226 134 L252 162 L208 168Z" fill="url(#fur)"/>
          <path d="M150 160 Q104 146 80 160 Q92 198 150 200 Q208 198 220 160 Q196 146 150 160Z" fill="#fff3e4"/>
          <ellipse cx="96" cy="164" rx="13" ry="8" fill="#ff8fa3" opacity=".55"/><ellipse cx="204" cy="164" rx="13" ry="8" fill="#ff8fa3" opacity=".55"/>
          <g class="eyes-open">
            <g class="eye"><ellipse cx="116" cy="140" rx="12" ry="15" fill="#3b2418"/><circle cx="112" cy="134" r="4.5" fill="#fff"/><circle cx="121" cy="147" r="2.2" fill="#fff"/></g>
            <g class="eye"><ellipse cx="184" cy="140" rx="12" ry="15" fill="#3b2418"/><circle cx="180" cy="134" r="4.5" fill="#fff"/><circle cx="189" cy="147" r="2.2" fill="#fff"/></g>
          </g>
          <g class="eyes-happy" fill="none" stroke="#3b2418" stroke-width="5" stroke-linecap="round"><path d="M103 144 Q116 128 129 144"/><path d="M171 144 Q184 128 197 144"/></g>
          <g class="brows" fill="none" stroke="#7a3b2a" stroke-width="4" stroke-linecap="round"><path d="M100 124 Q114 122 130 112"/><path d="M200 124 Q186 122 170 112"/></g>
          <ellipse cx="150" cy="164" rx="7" ry="5" fill="#3b2418"/>
          <path class="mouth m-smile" d="M137 174 Q150 186 163 174" fill="none" stroke="#3b2418" stroke-width="3.5" stroke-linecap="round"/>
          <path class="mouth m-open" d="M136 172 Q150 200 164 172Z" fill="#c4414f" stroke="#3b2418" stroke-width="3" stroke-linejoin="round"/>
          <path class="mouth m-sad" d="M139 182 Q150 171 161 182" fill="none" stroke="#3b2418" stroke-width="3.5" stroke-linecap="round"/>
          <path class="sweat" d="M232 108 Q224 124 232 128 Q240 124 232 108Z" fill="#8fd3ff" stroke="#5aaee0" stroke-width="2"/>
        </g>
      </svg>
    </button>
  </div>

  <p id="hint" class="hint">tap the fox</p>

  <!-- ===== CAKE ===== -->
  <div id="cake-wrap">
    <p id="wish" class="wish">Make a wish ✨</p>
    <svg id="cake" viewBox="0 0 340 300" xmlns="http://www.w3.org/2000/svg">
      <defs><radialGradient id="glow"><stop offset="0" stop-color="#ffd98a" stop-opacity=".9"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient></defs>
      <ellipse cx="170" cy="272" rx="150" ry="20" fill="#f3e6dc"/><ellipse cx="170" cy="266" rx="150" ry="18" fill="#fff7ef"/>
      <rect x="50" y="170" width="240" height="95" rx="22" fill="#f7a8b8"/>
      <path d="M50 190 Q50 160 80 160 H260 Q290 160 290 190 Q275 206 260 190 Q245 210 230 190 Q215 208 200 190 Q185 210 170 190 Q155 208 140 190 Q125 210 110 190 Q95 206 80 190 Q65 208 50 190Z" fill="#fff4ea"/>
      <g fill="#fff4ea" opacity=".9"><circle cx="90" cy="228" r="5"/><circle cx="140" cy="240" r="5"/><circle cx="200" cy="230" r="5"/><circle cx="250" cy="242" r="5"/><circle cx="170" cy="222" r="4"/></g>
      <rect x="90" y="100" width="160" height="75" rx="18" fill="#ffc9a8"/>
      <path d="M90 120 Q90 92 118 92 H222 Q250 92 250 120 Q235 134 222 120 Q208 138 194 120 Q180 138 166 120 Q152 138 138 120 Q124 136 110 120 Q98 134 90 120Z" fill="#fff4ea"/>
      <g fill="#e8576f"><circle cx="124" cy="150" r="5"/><circle cx="216" cy="152" r="5"/><circle cx="170" cy="156" r="5"/></g>
      <!-- candles: x positions 130 / 170 / 210 -->
      <g class="candle" transform="translate(130 0)"><rect x="-5" y="56" width="10" height="42" rx="4" fill="#9fd8f0"/><path d="M-5 70 L5 64 M-5 82 L5 76" stroke="#fff" stroke-width="3"/><g transform="translate(0 54)"><circle class="halo" r="28" cy="-18" fill="url(#glow)"/><g class="flame"><path d="M0 0 C-9 -10 -6 -22 0 -34 C6 -22 9 -10 0 0Z" fill="#ffb02e"/><path d="M0 0 C-4 -6 -3 -13 0 -19 C3 -13 4 -6 0 0Z" fill="#fff3b0"/></g><g class="smoke"><circle cx="0" cy="-6" r="4"/><circle cx="3" cy="-6" r="3"/><circle cx="-3" cy="-6" r="3.5"/></g></g></g>
      <g class="candle" transform="translate(170 0)"><rect x="-5" y="50" width="10" height="48" rx="4" fill="#ffe27a"/><path d="M-5 64 L5 58 M-5 78 L5 72" stroke="#fff" stroke-width="3"/><g transform="translate(0 48)"><circle class="halo" r="28" cy="-18" fill="url(#glow)"/><g class="flame"><path d="M0 0 C-9 -10 -6 -22 0 -34 C6 -22 9 -10 0 0Z" fill="#ffb02e"/><path d="M0 0 C-4 -6 -3 -13 0 -19 C3 -13 4 -6 0 0Z" fill="#fff3b0"/></g><g class="smoke"><circle cx="0" cy="-6" r="4"/><circle cx="3" cy="-6" r="3"/><circle cx="-3" cy="-6" r="3.5"/></g></g></g>
      <g class="candle" transform="translate(210 0)"><rect x="-5" y="56" width="10" height="42" rx="4" fill="#f9a3c0"/><path d="M-5 70 L5 64 M-5 82 L5 76" stroke="#fff" stroke-width="3"/><g transform="translate(0 54)"><circle class="halo" r="28" cy="-18" fill="url(#glow)"/><g class="flame"><path d="M0 0 C-9 -10 -6 -22 0 -34 C6 -22 9 -10 0 0Z" fill="#ffb02e"/><path d="M0 0 C-4 -6 -3 -13 0 -19 C3 -13 4 -6 0 0Z" fill="#fff3b0"/></g><g class="smoke"><circle cx="0" cy="-6" r="4"/><circle cx="3" cy="-6" r="3"/><circle cx="-3" cy="-6" r="3.5"/></g></g></g>
      <rect id="candle-hit" x="100" y="0" width="140" height="110" fill="transparent"/>
    </svg>
  </div>

  <!-- ===== ENVELOPE ===== -->
  <div id="envelopes">
    <button class="envelope" data-i="0" aria-label="Open letter 1"><span class="env-body"></span><span class="env-paper"></span><span class="env-pocket"></span><span class="env-flap"></span><span class="env-seal">♥</span><span class="env-label"></span></button>
    <button class="envelope" data-i="1" aria-label="Open letter 2"><span class="env-body"></span><span class="env-paper"></span><span class="env-pocket"></span><span class="env-flap"></span><span class="env-seal">♥</span><span class="env-label"></span></button>
  </div>
</main>

<!-- ===== LETTER ===== -->
<div id="letter-overlay" aria-hidden="true">
  <article id="letter"><button id="letter-close" aria-label="Close letter">×</button><h2 id="letter-title"></h2><div id="letter-body"></div><p id="letter-sign"></p></article>
</div>

<canvas id="fx" aria-hidden="true"></canvas>
<button id="music-btn" aria-label="Mute or unmute music" title="Music">♪</button>
<input type="file" id="music-file" accept="audio/*" hidden>
<script src="fx.js"></script>
<script src="letters.js"></script>
<script src="script.js"></script>
</body>
</html>
